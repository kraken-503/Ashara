name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sanity check before releasing
        run: |
          python -m py_compile main.py app.py player.py scanner.py
          python -c "import scanner, player, app"

      - name: Package source
        run: |
          mkdir -p dist
          zip -r "dist/Ashara-${GITHUB_REF_NAME}.zip" \
            main.py app.py player.py scanner.py \
            requirements.txt README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Ashara-${{ github.ref_name }}.zip
          generate_release_notes: true
